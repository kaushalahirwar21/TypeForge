{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — TypeRise{% endblock %}

{% block content %}
<div class="container" style="padding: 4.5rem 1.5rem; max-width: 460px;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Reset your TypeRise password</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Enter your account email to receive reset instructions.</p>
    </div>

    <form method="POST" action="{% url 'forgot_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="your.email@example.com" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
        Send Reset Link
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
      Remember your password? <a href="{% url 'login' %}">Log In</a>
    </div>
  </div>
</div>
{% endblock %}
