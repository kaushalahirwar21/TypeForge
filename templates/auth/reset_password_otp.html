{% extends 'base.html' %}
{% load static %}

{% block title %}Set New Password — TypeForge{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; max-width: 480px;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(99, 102, 241, 0.15); border: 2px solid rgba(99, 102, 241, 0.4); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Reset Password</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; line-height: 1.5;">
        Enter the 6-digit code sent to<br>
        <strong style="color: #818cf8; word-break: break-all;">{{ email }}</strong>
      </p>
    </div>

    <form method="POST" action="{% url 'reset_password_otp' %}">
      {% csrf_token %}

      <div class="form-group">
        <label class="form-label" for="otp_code">6-Digit Verification Code</label>
        <input type="text" id="otp_code" name="otp_code" inputmode="numeric" maxlength="6" class="form-input" placeholder="e.g. 123456" style="text-align: center; font-size: 1.3rem; font-weight: 700; letter-spacing: 6px;" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" class="form-input" placeholder="Min 6 characters" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter your new password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
        Update Password
      </button>
    </form>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.75rem; font-size: 0.85rem; padding-top: 1rem; border-top: 1px solid rgba(148, 163, 184, 0.1);">
      <a href="{% url 'login' %}" style="color: var(--text-muted); text-decoration: none;">
        &larr; Back to Log In
      </a>
      <a href="{% url 'resend_otp' %}?purpose=forgot_password" style="color: #38bdf8; font-weight: 600; text-decoration: none;">
        Resend Code
      </a>
    </div>
  </div>
</div>
{% endblock %}
