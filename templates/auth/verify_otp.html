{% extends 'base.html' %}
{% load static %}

{% block title %}Verify Email Address — TypeForge{% endblock %}

{% block content %}
<div class="container" style="padding: 4rem 1.5rem; max-width: 480px;">
  <div class="card" style="padding: 2.5rem 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(56, 189, 248, 0.15); border: 2px solid rgba(56, 189, 248, 0.4); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </div>
      <h1 style="font-size: 1.75rem; font-weight: 800; color: #ffffff;">Verify Your Email</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; line-height: 1.5;">
        We have sent a 6-digit code to<br>
        <strong style="color: #38bdf8; word-break: break-all;">{{ email }}</strong>
      </p>
    </div>

    <form method="POST" action="{% url 'verify_otp' %}" id="otpForm">
      {% csrf_token %}

      <div class="form-group" style="text-align: center;">
        <label class="form-label" style="margin-bottom: 0.75rem; display: block; font-weight: 600;">
          Enter 6-Digit Code
        </label>
        
        <!-- 6 Separate Digit Boxes with Auto-Hop -->
        <div style="display: flex; justify-content: center; gap: 8px; margin-bottom: 1.25rem;">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d1" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autofocus autocomplete="off">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d2" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autocomplete="off">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d3" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autocomplete="off">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d4" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autocomplete="off">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d5" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autocomplete="off">
          <input type="text" inputmode="numeric" maxlength="1" class="form-input otp-digit" id="d6" style="width: 48px; height: 56px; text-align: center; font-size: 1.5rem; font-weight: 800; padding: 0;" autocomplete="off">
        </div>

        <input type="hidden" name="otp_code" id="hiddenOtp">

        <!-- Countdown Timer -->
        <div style="margin: 0.75rem 0 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
          Code expires in: <span id="countdown" style="font-weight: 700; color: #f59e0b;">10:00</span>
        </div>
      </div>

      <button type="submit" id="verifyBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
        Verify &amp; Create Account
      </button>
    </form>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.75rem; font-size: 0.85rem; padding-top: 1rem; border-top: 1px solid rgba(148, 163, 184, 0.1);">
      <a href="{% url 'signup' %}" style="color: var(--text-muted); text-decoration: none;">
        &larr; Change Email
      </a>
      <a href="{% url 'resend_otp' %}?purpose=signup" id="resendLink" style="color: #38bdf8; font-weight: 600; text-decoration: none;">
        Resend Code
      </a>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const digits = document.querySelectorAll('.otp-digit');
  const hiddenOtp = document.getElementById('hiddenOtp');
  const form = document.getElementById('otpForm');

  function updateHiddenOtp() {
    let fullCode = '';
    digits.forEach(d => fullCode += d.value);
    hiddenOtp.value = fullCode;
  }

  digits.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      const val = e.target.value.replace(/[^0-9]/g, '');
      input.value = val ? val[val.length - 1] : '';
      updateHiddenOtp();
      if (input.value && index < digits.length - 1) {
        digits[index + 1].focus();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && index > 0) {
        digits[index - 1].focus();
      }
    });

    // Handle full paste
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
      if (pasteData) {
        for (let i = 0; i < digits.length; i++) {
          if (i < pasteData.length) {
            digits[i].value = pasteData[i];
          }
        }
        updateHiddenOtp();
        const nextFocus = Math.min(pasteData.length, digits.length - 1);
        digits[nextFocus].focus();
      }
    });
  });

  form.addEventListener('submit', (e) => {
    updateHiddenOtp();
    if (hiddenOtp.value.length !== 6) {
      e.preventDefault();
      alert('Please enter all 6 digits of your verification code.');
    }
  });

  // Countdown timer: 10 minutes (600 seconds)
  let timeLeft = 600;
  const timerDisplay = document.getElementById('countdown');
  const countdownInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) {
      clearInterval(countdownInterval);
      timerDisplay.textContent = 'Expired';
      timerDisplay.style.color = '#ef4444';
    } else {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }
  }, 1000);
});
</script>
{% endblock %}
