services:
  - type: web
    name: typerise
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "./build.sh"
    startCommand: "gunicorn typeforge.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: typerise-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,typerise.ai,www.typerise.ai"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://typerise.ai,https://www.typerise.ai"
      - key: EMAIL_FROM_NAME
        value: "TypeRise"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: typerise-db
    plan: free
    region: oregon
    databaseName: typerise
    user: typerise_user

