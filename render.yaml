services:
  - type: web
    name: typeforge
    runtime: python
    region: oregon
    plan: free
    branch: master
    buildCommand: "./build.sh"
    startCommand: "gunicorn typeforge.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: typeforge-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,typeforge.ai,www.typeforge.ai"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://typeforge.ai,https://www.typeforge.ai"

databases:
  - name: typeforge-db
    plan: free
    region: oregon
    databaseName: typeforge
    user: typeforge_user
